name: Build

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Документация и CI-конфиги не влияют на APK — PR только с такими
    # изменениями не собираем вовсе (issue #111).
    paths-ignore:
      - "**.md"
      - "**.markdown"
      - ".github/**"
  workflow_dispatch:

jobs:
  release-tag:
    name: Auto tag
    # Push в main: бампает patch, коммитит, создаёт тег → триггерит release.
    # Коммит через GITHUB_TOKEN не триггерит новый workflow (защита от петли).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth: 0 — нужен для diff github.event.before..github.sha
          # (мелкий клон не содержит родителя предыдущего коммита)
          fetch-depth: 0

      # Пуш только с .md / .github изменениями не является изменением
      # приложения: тег не трогаем, релиз не собираем (issue #111).
      - name: Check for buildable changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          if [ -z "$CHANGED" ]; then
            # Первый коммит репозитория / недоступный before — собираем как обычно
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Изменённые файлы:"
          echo "$CHANGED"
          NON_BUILDABLE=$(echo "$CHANGED" | grep -v -E '(^|\.)(md|markdown)$|^\.github/' || true)
          if [ -z "$NON_BUILDABLE" ]; then
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "Только документация/workflow — сборка и релиз не нужны"
          else
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          fi

      # Версию бампит автор в том же PR (процесс в AGENTS.md) — бот ничего
      # не пушит в main: branch protection требует PR для всех изменений (#95).
      - name: Read version
        id: version
        if: steps.changes.outputs.buildable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="gradle/libs.versions.toml"
          MAJOR=$(grep -oP 'versionMajor = "\K[0-9]+' "$FILE")
          MINOR=$(grep -oP 'versionMinor = "\K[0-9]+' "$FILE")
          PATCH=$(grep -oP 'versionPatch = "\K[0-9]+' "$FILE")
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "version=v$MAJOR.$MINOR.$PATCH"

      - name: Create tag
        if: steps.changes.outputs.buildable == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const ver = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${ver}`,
                sha: context.sha
              });
              console.log(`Тег ${ver} создан`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Тег ${ver} уже существует — ок`);
              } else {
                throw e;
              }
            }

      # Диспатчим release-сборку только если релиза для тега ещё нет.
      # Без проверки каждый merge в main перестраивал последний тег и
      # перезаливал те же APK в опубликованный релиз (см. issue #109:
      # v0.5.35 собиралась 6 раз).
      - name: Trigger release workflow (skip if already published)
        if: steps.changes.outputs.buildable == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const ver = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: ver
              });
              console.log(`Релиз ${ver} уже опубликован — сборка не требуется`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
              // 404 — релиза нет, собираем
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: ver
            });
            console.log(`Релиз ${ver} отсутствует — запущена release-сборка`);

  build:
    name: Build debug APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # lintDebug добавлен: PR-пайплайн должен ловить проблемы линтером,
      # а не только компилятором и unit-тестами (см. issue #91).
      - name: Build + test + lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --parallel --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Unit-тесты перед сборкой релиза: тег не должен собираться
      # из непротестированного кода (см. issue #91).
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --parallel --build-cache

      - name: Build signed release APK
        run: ./gradlew assembleRelease --parallel --build-cache
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Extract changelog
        id: changelog
        run: |
          VER="${{ github.ref_name }}"
          VER_NUM="${VER#v}"
          # Извлекаем секцию из CHANGELOG.md между заголовком версии и следующим заголовком
          BODY=$(awk "/^## \\[${VER_NUM}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            # Нет записи в CHANGELOG — генерируем из git log с предыдущего тега
            # Получаем предыдущий тег (исключая текущий)
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VER}$" | head -1)
            if [ -n "$PREV_TAG" ]; then
              BODY="### Изменено"$'\n\n'
              BODY+=$(git log --oneline "${PREV_TAG}..${VER}" --no-merges --grep="^chore: auto-bump" --invert-grep | sed 's/^/- /')
            else
              BODY="**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/${VER}~1...${VER}"
            fi
          fi
          echo "$BODY" > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_body.md
          files: app/build/outputs/apk/release/*.apk
