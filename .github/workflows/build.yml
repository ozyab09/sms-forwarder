name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  release-tag:
    name: Auto-release (тег + релиз)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      created: ${{ steps.create-tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from libs.versions.toml
        id: read-version
        run: |
          MAJOR=$(grep -oP 'versionMajor = "\K[0-9]+' gradle/libs.versions.toml)
          MINOR=$(grep -oP 'versionMinor = "\K[0-9]+' gradle/libs.versions.toml)
          PATCH=$(grep -oP 'versionPatch = "\K[0-9]+' gradle/libs.versions.toml)
          echo "version=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "version=v$MAJOR.$MINOR.$PATCH"

      - name: Check if tag exists
        id: check-tag
        run: |
          VER="${{ steps.read-version.outputs.version }}"
          if git rev-parse "refs/tags/$VER" >/dev/null 2>&1; then
            echo "Тег $VER уже существует — релиз уже создан, пропускаю"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag via API
        if: steps.check-tag.outputs.created == 'true'
        id: create-tag
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ steps.read-version.outputs.version }}';
            const sha = context.sha;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${ver}`,
                sha
              });
              console.log(`Тег ${ver} создан`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Тег ${ver} уже существует — ок`);
              } else {
                throw e;
              }
            }

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build release APK
    # always(): needs.release-tag может быть skipped (на run от тега) — иначе release не стартует.
    # Условия: (а) push тега v*; (б) main-push, где release-tag джоба создала новый тег.
    needs: release-tag
    if: |
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-tag.outputs.created == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ needs.release-tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "RELEASE_VERSION=${{ steps.version.outputs.version }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk