name: Build

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  release-tag:
    name: Auto tag
    # Push в main: бампает patch, коммитит, создаёт тег → триггерит release.
    # Коммит через GITHUB_TOKEN не триггерит новый workflow (защита от петли).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read + bump version
        id: version
        run: |
          FILE="gradle/libs.versions.toml"
          MAJOR=$(grep -oP 'versionMajor = "\K[0-9]+' "$FILE")
          MINOR=$(grep -oP 'versionMinor = "\K[0-9]+' "$FILE")
          PATCH=$(grep -oP 'versionPatch = "\K[0-9]+' "$FILE")
          CURRENT="v$MAJOR.$MINOR.$PATCH"

          # Проверяем, существует ли уже тег для текущей версии
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CURRENT" >/dev/null 2>&1; then
            # Тег есть — бампаем patch
            NEW_PATCH=$((PATCH + 1))
            sed -i "s/versionPatch = \"$PATCH\"/versionPatch = \"$NEW_PATCH\"/" "$FILE"
            NEW_VER="v$MAJOR.$MINOR.$NEW_PATCH"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            # Тега нет — пользователь уже бампнул версию в PR
            NEW_VER="$CURRENT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VER (bumped=$([[ $NEW_VER == $CURRENT ]] && echo no || echo yes))"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: auto-bump version to ${{ steps.version.outputs.tag }}"
          git push

      - name: Create tag
        uses: actions/github-script@v8
        with:
          script: |
            const ver = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${ver}`,
                sha: context.sha
              });
              console.log(`Тег ${ver} создан`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Тег ${ver} уже существует — ок`);
              } else {
                throw e;
              }
            }

      - name: Trigger release workflow
        uses: actions/github-script@v8
        with:
          script: |
            const ver = '${{ steps.version.outputs.tag }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: ver
            });
            console.log(`Release workflow запущен для ${ver}`);

  build:
    name: Build debug APK
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test + lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew testReleaseUnitTest assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk