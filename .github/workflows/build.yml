name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Только push в main: читает версию из toml, создаёт тег (если ещё нет)
  # и запускает release-workflow по этому тегу. Релизная сборка тут НЕ выполняется.
  release-tag:
    name: Auto tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from libs.versions.toml
        id: read-version
        run: |
          MAJOR=$(grep -oP 'versionMajor = "\K[0-9]+' gradle/libs.versions.toml)
          MINOR=$(grep -oP 'versionMinor = "\K[0-9]+' gradle/libs.versions.toml)
          PATCH=$(grep -oP 'versionPatch = "\K[0-9]+' gradle/libs.versions.toml)
          echo "version=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "version=v$MAJOR.$MINOR.$PATCH"

      - name: Check if tag exists
        id: check-tag
        run: |
          VER="${{ steps.read-version.outputs.version }}"
          if git rev-parse "refs/tags/$VER" >/dev/null 2>&1; then
            echo "Тег $VER уже существует — пропускаю"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag via API
        if: steps.check-tag.outputs.created == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const ver = '${{ steps.read-version.outputs.version }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${ver}`,
                sha: context.sha
              });
              console.log(`Тег ${ver} создан`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Тег ${ver} уже существует — ок`);
              } else {
                throw e;
              }
            }

      - name: Trigger release workflow by tag
        if: steps.check-tag.outputs.created == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const ver = '${{ steps.read-version.outputs.version }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: ver
            });
            console.log(`Workflow запущен по тегу ${ver}`);

  # Проверка кода: PR и push в main (debug APK + тесты + lint)
  build:
    name: Build debug APK
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  # Только по тегу: push тега v* ИЛИ workflow_dispatch от Auto tag.
  # Версия берётся из GITHUB_REF_NAME (в обоих случаях это имя тега).
  release:
    name: Build release APK
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk