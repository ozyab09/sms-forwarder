# ============================================================
# SMS Forwarder — GitLab CI/CD
# Сборка, тесты, релизы и теги в рамках SemVer (vX.Y.Z)
# ============================================================

stages:
  - build
  - test
  - release
  - publish

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

# Глобальный кэш Gradle (между джобами и пайплайнами)
cache:
  key:
    files:
      - gradle/libs.versions.toml
  paths:
    - .gradle-home/caches/
    - .gradle-home/wrapper/
    - .gradle/

# ---------- BUILD (все ветки, каждый push) ----------
build:
  stage: build
  image: eclipse-temurin:17-jdk
  script:
    - chmod +x gradlew
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'            # теги тоже собираем (для релиза)
      when: always
    - when: always

# ---------- TEST (все ветки) ----------
test:
  stage: test
  image: eclipse-temurin:17-jdk
  script:
    - chmod +x gradlew
    - ./gradlew testDebugUnitTest lintDebug --no-daemon
  artifacts:
    paths:
      - app/build/reports/
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: always

# ---------- RELEASE: подписанный APK (только теги v*) ----------
release:
  stage: release
  image: eclipse-temurin:17-jdk
  script:
    - chmod +x gradlew
    # Версия берётся из CI_COMMIT_TAG (см. app/build.gradle.kts)
    - ./gradlew assembleRelease --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 1 year
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: release

# ---------- PUBLISH: GitLab Release (только теги v*) ----------
publish:
  stage: publish
  image: alpine:latest
  needs:
    - release
  script:
    - apk add --no-cache curl jq
    - |
      APK=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null || ls app/build/outputs/apk/release/*.apk | head -1)
      echo "APK: $APK"
      SHA=$(sha256sum "$APK" | awk '{print $1}')
      # Сборка changelog: коммиты между предыдущим тегом и текущим
      PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
      if [ -n "$PREV_TAG" ]; then
        CHANGELOG=$(git log --oneline --no-merges "$PREV_TAG".."$CI_COMMIT_TAG")
      else
        CHANGELOG="Первый релиз"
      fi
      # Создание release через GitLab Releases API (токен в CI_JOB_TOKEN)
      TAG_NAME="$CI_COMMIT_TAG"
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "name=$TAG_NAME" \
        --data-urlencode "tag_name=$TAG_NAME" \
        --data-urlencode "description=## $TAG_NAME

$CHANGELOG

SHA-256: $SHA" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ---------- Docker-образ для сборки (Android SDK) ----------
# Указан eclipse-temurin:17-jdk, но для Android нужен SDK.
# В реальном GitLab рекомендую собрать собственный образ:
#   FROM eclipse-temurin:17-jdk
#   RUN apt-get update && apt-get install -y unzip wget \
#     && wget cmdline-tools ... (Android SDK 34)
#   ENV ANDROID_HOME=/opt/android-sdk
# Или использовать готовый `android:latest` из registry.