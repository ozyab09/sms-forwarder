# Gradle
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: фаза конфигурации (~5-10 c) выполняется один раз и кэшируется
org.gradle.configuration-cache=true
# File system watching: инкрементальные сборки без повторного сканирования FS
org.gradle.vfs.watch=true

# Версия приложения (SemVer). Переопределяется в GitLab CI из тега vX.Y.Z.
VERSION_MAJOR=0
VERSION_MINOR=1
VERSION_PATCH=0

# GitLab CI переопределяет через -PVERSION_NAME=... и -PVERSION_CODE=...
VERSION_NAME=0.1.0
VERSION_CODE=100
# AndroidX обязателен (AGP 8 требует явного включения)
android.useAndroidX=true

# KSP2 использует kotlin.sourceSets DSL — конфликт со встроенным Kotlin AGP 9.1
android.disallowKotlinSourceSets=false
